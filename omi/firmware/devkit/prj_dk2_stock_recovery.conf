# Diagnostic/safety overlay for the official Omi DK2 v2.0.10 configuration.
# This file is merged after prj_xiao_ble_sense_devkitv2-adafruit.conf.
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USB_DEVICE_PID=0x0101
CONFIG_USB_DEVICE_PRODUCT="Omi DK2 Stock Recovery"

# Reach the official BLE/audio path without allowing optional peripherals to
# abort startup. The recovery overlay parks both physical actuators low.
CONFIG_OMI_ENABLE_OFFLINE_STORAGE=n
CONFIG_OMI_ENABLE_ACCELEROMETER=n
CONFIG_OMI_ENABLE_BUTTON=n
CONFIG_OMI_ENABLE_SPEAKER=n
CONFIG_OMI_ENABLE_BATTERY=n
CONFIG_OMI_ENABLE_USB=n
CONFIG_OMI_ENABLE_HAPTIC=n

CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_USE_DT_CODE_PARTITION=y
